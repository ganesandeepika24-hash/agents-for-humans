<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clearway Finance — 0% Balance Transfer</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #f0f4f0; color: #1a2e1a; }
  header { background: #1b4332; padding: 20px 40px; }
  .logo { font-weight: 800; font-size: 22px; color: #95d5b2; }
  .container { max-width: 700px; margin: 40px auto; background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h1 { font-size: 26px; color: #1b4332; }
  .rate { font-size: 40px; font-weight: 800; margin: 12px 0; color: #2d6a4f; }
  .rate span { font-size: 16px; font-weight: 400; color: #555; }
  .btn { display: inline-block; background: #2d6a4f; color: white; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 700; margin-top: 20px; }
  ul { line-height: 1.9; }
  .fee-note { background: #f0f4f0; padding: 12px 16px; border-radius: 8px; margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<header><span class="logo">Clearway Finance</span></header>
<div class="container">
  <h1>0% Balance Transfer Card</h1>
  <div class="rate">0% APR<span> for 18 months</span></div>
  <ul>
    <li>0% interest on transferred balances for 18 months</li>
    <li>3% one-off transfer fee</li>
    <li>No annual fee</li>
  </ul>
  <div class="fee-note">On a £1,200 transfer, the fee would be approximately £36.00.</div>
  <a class="btn" href="#">Apply for balance transfer</a>
</div>
</body>
</html>
