<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meridian Broadband — My Account</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #f4f6f8; color: #1a1a2e; }
  header { background: #0d3b66; color: white; padding: 20px 40px; display: flex; align-items: center; gap: 12px; }
  header .logo { font-weight: 800; font-size: 22px; }
  .container { max-width: 700px; margin: 40px auto; background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h1 { font-size: 22px; }
  .banner { background: #fff3cd; border: 1px solid #ffe69c; border-radius: 8px; padding: 16px; margin: 20px 0; }
  .btn { display: inline-block; background: #0d3b66; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 16px; }
  .btn:hover { background: #08284a; }
  .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header><span class="logo">Meridian Broadband</span></header>
<div class="container">
  <h1>Your Account</h1>
  <div class="banner">
    <strong>Your contract renews on 15 September 2026.</strong><br>
    After this date your monthly price changes to £65.00.
  </div>
  <div class="detail-row"><span>Current plan</span><span>150 Mbps Fibre</span></div>
  <div class="detail-row"><span>Current price</span><span>£45.00/month</span></div>
  <div class="detail-row"><span>Renewal price</span><span>£65.00/month</span></div>
  <a class="btn" href="#">Talk to our retention team</a>
</div>
</body>
</html>
