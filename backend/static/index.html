<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AgentNick Push Test</title>
</head>
<body style="font-family: sans-serif; max-width: 500px; margin: 40px auto;">
  <h1>AgentNick — Push Notification Test</h1>
  <p id="status">Checking support...</p>
  <button id="subscribeBtn" style="padding: 10px 20px; font-size: 16px;">Enable Notifications</button>

  <script>
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('subscribeBtn');

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }

    async function init() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        statusEl.textContent = 'Push notifications are not supported in this browser.';
        btn.disabled = true;
        return;
      }
      statusEl.textContent = 'Push is supported. Click the button to enable notifications.';
    }

    btn.addEventListener('click', async () => {
      try {
        const registration = await navigator.serviceWorker.register('/static/sw.js');
        statusEl.textContent = 'Service worker registered. Requesting permission...';

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          statusEl.textContent = 'Permission denied.';
          return;
        }

        const keyResponse = await fetch('/vapid-public-key');
        const { key } = await keyResponse.json();

        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(key),
        });

        await fetch('/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(subscription),
        });

        statusEl.textContent = 'Subscribed! You will now receive AgentNick notifications.';
        btn.disabled = true;
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        console.error(err);
      }
    });

    init();
  </script>
</body>
</html>
