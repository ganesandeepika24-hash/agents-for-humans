<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coastway Internet — Plans</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #fef9f3; color: #2d2a26; }
  header { background: #e8871e; padding: 20px 40px; }
  .logo { font-weight: 800; font-size: 22px; color: white; }
  .container { max-width: 700px; margin: 40px auto; background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h1 { font-size: 26px; }
  .price { font-size: 40px; font-weight: 800; margin: 12px 0; color: #e8871e; }
  .price span { font-size: 16px; font-weight: 400; color: #7a7266; }
  .btn { display: inline-block; background: #e8871e; color: white; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 700; margin-top: 20px; }
  ul { line-height: 1.9; }
  .badge { display: inline-block; background: #fdeed9; color: #e8871e; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; }
</style>
</head>
<body>
<header><span class="logo">Coastway Internet</span></header>
<div class="container">
  <span class="badge">NO SETUP FEE</span>
  <h1>152 Mbps Fibre</h1>

  <ul>
    <li>152 Mbps average download speed</li>
    <li>24-month contract</li>
    <li>£0.00 setup fee</li>
    <li>Free installation</li>
  </ul>
  <a class="btn" href="#">Get connected</a>

</html>
