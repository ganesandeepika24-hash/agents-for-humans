<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vantage Trust Bank — My Card</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #f5f5f7; color: #1a1a1a; }
  header { background: #4a1942; color: white; padding: 20px 40px; }
  .logo { font-weight: 800; font-size: 22px; }
  .container { max-width: 700px; margin: 40px auto; background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h1 { font-size: 22px; }
  .banner { background: #fff3cd; border: 1px solid #ffe69c; border-radius: 8px; padding: 16px; margin: 20px 0; }
  .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
  .btn { display: inline-block; background: #4a1942; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 16px; }
</style>
</head>
<body>
<header><span class="logo">Vantage Trust Bank</span></header>
<div class="container">
  <h1>Your Card</h1>
  <div class="banner">
    <strong>Your 0% promotional rate ends 25 September 2026.</strong><br>
    Standard APR of 24.9% applies after this date.
  </div>
  <div class="detail-row"><span>Outstanding balance</span><span>£1,200.00</span></div>
  <div class="detail-row"><span>Minimum payment</span><span>£35.00/month</span></div>
  <a class="btn" href="#">Manage my payments</a>
</div>
</body>
</html>
